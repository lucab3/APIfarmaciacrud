<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Farmacias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        #map {
            height: 400px;
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
        }
        .card {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .farmacia-item {
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .farmacia-item:hover {
            background-color: #f8f9fa;
        }
        .result-card {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="display-4 mb-4 text-center">Buscador de Farmacias</h1>
        
        <div class="row">
            <!-- Columna izquierda: búsqueda y resultados -->
            <div class="col-md-5">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Buscar farmacia cercana</h5>
                    </div>
                    <div class="card-body">
                        <form id="locationForm">
                            <div class="mb-3">
                                <label for="latInput" class="form-label">Latitud</label>
                                <input type="number" step="any" class="form-control" id="latInput" placeholder="Ej: 30.400000">
                            </div>
                            <div class="mb-3">
                                <label for="lonInput" class="form-label">Longitud</label>
                                <input type="number" step="any" class="form-control" id="lonInput" placeholder="Ej: 10.000000">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Buscar farmacia más cercana</button>
                            </div>
                            <div class="text-center mt-3">
                                <button type="button" id="useMyLocation" class="btn btn-outline-secondary">Usar mi ubicación</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Resultado de farmacia más cercana -->
                <div id="resultCard" class="card result-card mb-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="card-title mb-0">Farmacia más cercana</h5>
                    </div>
                    <div class="card-body">
                        <h5 id="farmaciaNombre" class="card-title"></h5>
                        <p id="farmaciaUbicacion" class="card-text"></p>
                        <p class="card-text">Distancia: <span id="farmaciaDistancia"></span> km</p>
                        <button id="verEnMapa" class="btn btn-sm btn-outline-primary">Ver en mapa</button>
                    </div>
                </div>
            </div>

            <!-- Columna derecha: mapa y lista de farmacias -->
            <div class="col-md-7">
                <div class="card mb-4">
                    <div class="card-header bg-info text-white">
                        <h5 class="card-title mb-0">Mapa de farmacias</h5>
                    </div>
                    <div class="card-body p-0">
                        <div id="map"></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">Todas las farmacias</h5>
                        <button id="refreshFarmacias" class="btn btn-sm btn-light">Actualizar</button>
                    </div>
                    <div class="card-body p-0">
                        <ul id="farmaciasList" class="list-group list-group-flush"></ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal para agregar/editar farmacia -->
        <div class="modal fade" id="farmaciaModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">Nueva Farmacia</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="farmaciaForm">
                            <input type="hidden" id="farmaciaId">
                            <div class="mb-3">
                                <label for="nombreInput" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombreInput" required>
                            </div>
                            <div class="mb-3">
                                <label for="ubicacionInput" class="form-label">Ubicación</label>
                                <input type="text" class="form-control" id="ubicacionInput" required>
                            </div>
                            <div class="mb-3">
                                <label for="latitudInput" class="form-label">Latitud</label>
                                <input type="number" step="any" class="form-control" id="latitudInput" required>
                            </div>
                            <div class="mb-3">
                                <label for="longitudInput" class="form-label">Longitud</label>
                                <input type="number" step="any" class="form-control" id="longitudInput" required>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" id="saveFarmacia" class="btn btn-primary">Guardar</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Botón flotante para agregar -->
        <div class="position-fixed bottom-0 end-0 p-3">
            <button id="addFarmaciaBtn" class="btn btn-lg btn-primary rounded-circle shadow">
                <i class="bi bi-plus-lg"></i> +
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Variables globales
        const API_URL = 'http://localhost:3000/api';
        let map, currentMarker, farmaciaMarkers = [];
        let allFarmacias = [];
        let farmaciaModal;

        // Inicialización cuando el DOM está cargado
        document.addEventListener('DOMContentLoaded', function() {
            // Inicializar mapa
            initMap();
            
            // Cargar todas las farmacias
            loadFarmacias();
            
            // Inicializar modal
            farmaciaModal = new bootstrap.Modal(document.getElementById('farmaciaModal'));
            
            // Event listeners
            document.getElementById('locationForm').addEventListener('submit', searchNearestFarmacia);
            document.getElementById('useMyLocation').addEventListener('click', useMyLocation);
            document.getElementById('verEnMapa').addEventListener('click', focusOnNearest);
            document.getElementById('refreshFarmacias').addEventListener('click', loadFarmacias);
            document.getElementById('addFarmaciaBtn').addEventListener('click', showAddFarmaciaModal);
            document.getElementById('saveFarmacia').addEventListener('click', saveFarmacia);
        });

        // Inicializar mapa de Leaflet
        function initMap() {
            map = L.map('map').setView([0, 0], 2);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        // Cargar todas las farmacias
        function loadFarmacias() {
            fetch(`${API_URL}/farmacias`)
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.farmacias) {
                        allFarmacias = data.farmacias;
                        displayFarmaciasList(data.farmacias);
                        updateMapMarkers(data.farmacias);
                    }
                })
                .catch(error => console.error('Error al cargar farmacias:', error));
        }

        // Mostrar lista de farmacias
        function displayFarmaciasList(farmacias) {
            const listElement = document.getElementById('farmaciasList');
            listElement.innerHTML = '';
            
            farmacias.forEach(farmacia => {
                const li = document.createElement('li');
                li.className = 'list-group-item farmacia-item d-flex justify-content-between align-items-center';
                
                const farmaciaInfo = document.createElement('div');
                farmaciaInfo.innerHTML = `
                    <strong>${farmacia.nombre}</strong>
                    <div class="small text-muted">${farmacia.ubicacion}</div>
                    <div class="small">Lat: ${farmacia.latitud}, Lon: ${farmacia.longitud}</div>
                `;
                
                const btnGroup = document.createElement('div');
                btnGroup.className = 'btn-group btn-group-sm';
                
                const editBtn = document.createElement('button');
                editBtn.className = 'btn btn-outline-primary';
                editBtn.textContent = 'Editar';
                editBtn.addEventListener('click', () => showEditFarmaciaModal(farmacia));
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-outline-danger';
                deleteBtn.textContent = 'Eliminar';
                deleteBtn.addEventListener('click', () => deleteFarmacia(farmacia.id));
                
                btnGroup.appendChild(editBtn);
                btnGroup.appendChild(deleteBtn);
                
                li.appendChild(farmaciaInfo);
                li.appendChild(btnGroup);
                
                li.addEventListener('click', () => {
                    zoomToFarmacia(farmacia);
                });
                
                listElement.appendChild(li);
            });
        }

        // Actualizar marcadores en el mapa
        function updateMapMarkers(farmacias) {
            // Limpiar marcadores existentes
            farmaciaMarkers.forEach(marker => map.removeLayer(marker));
            farmaciaMarkers = [];
            
            // Añadir nuevos marcadores
            farmacias.forEach(farmacia => {
                const marker = L.marker([farmacia.latitud, farmacia.longitud])
                    .addTo(map)
                    .bindPopup(`
                        <b>${farmacia.nombre}</b><br>
                        ${farmacia.ubicacion}<br>
                        <button class="btn btn-sm btn-outline-primary mt-2" 
                        onclick="searchFromMarker(${farmacia.latitud}, ${farmacia.longitud})">
                        Buscar cercanas</button>
                    `);
                
                farmaciaMarkers.push(marker);
            });
            
            // Si hay marcadores, ajustar el mapa para mostrarlos todos
            if (farmaciaMarkers.length > 0) {
                const group = new L.featureGroup(farmaciaMarkers);
                map.fitBounds(group.getBounds(), { padding: [30, 30] });
            }
        }

        // Buscar farmacia más cercana
        function searchNearestFarmacia(e) {
            e.preventDefault();
            
            const lat = document.getElementById('latInput').value;
            const lon = document.getElementById('lonInput').value;
            
            if (!lat || !lon) {
                alert('Por favor ingrese latitud y longitud');
                return;
            }
            
            fetch(`${API_URL}/farmacia?lat=${lat}&lon=${lon}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.farmacia) {
                        displayNearestFarmacia(data.farmacia, lat, lon);
                    }
                })
                .catch(error => console.error('Error al buscar farmacia cercana:', error));
        }

        // Mostrar resultado de farmacia más cercana
        function displayNearestFarmacia(farmacia, clientLat, clientLon) {
            document.getElementById('farmaciaNombre').textContent = farmacia.nombre;
            document.getElementById('farmaciaUbicacion').textContent = farmacia.ubicacion;
            document.getElementById('farmaciaDistancia').textContent = farmacia.distancia;
            
            document.getElementById('resultCard').style.display = 'block';
            
            // Actualizar mapa
            if (currentMarker) map.removeLayer(currentMarker);
            
            // Marcador del cliente
            currentMarker = L.marker([clientLat, clientLon], {
                icon: L.divIcon({
                    className: 'current-location-marker',
                    html: '<div style="background-color: blue; border-radius: 50%; width: 15px; height: 15px; border: 2px solid white;"></div>',
                    iconSize: [15, 15],
                    iconAnchor: [7, 7]
                })
            }).addTo(map).bindPopup('Tu ubicación');
            
            // Encontrar marcador de la farmacia más cercana
            const farmaciaMarker = farmaciaMarkers.find(marker => 
                marker.getLatLng().lat === parseFloat(farmacia.latitud) && 
                marker.getLatLng().lng === parseFloat(farmacia.longitud)
            );
            
            if (farmaciaMarker) {
                farmaciaMarker.openPopup();
                
                // Dibujar línea desde cliente a farmacia
                const line = L.polyline([
                    [clientLat, clientLon],
                    [farmacia.latitud, farmacia.longitud]
                ], {
                    color: 'blue',
                    weight: 3,
                    opacity: 0.7,
                    dashArray: '5, 10'
                }).addTo(map);
                
                // Ajustar mapa para mostrar cliente y farmacia
                const group = new L.featureGroup([currentMarker, farmaciaMarker]);
                map.fitBounds(group.getBounds(), { padding: [30, 30] });
            }
        }

        // Usar ubicación actual del usuario
        function useMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    document.getElementById('latInput').value = position.coords.latitude;
                    document.getElementById('lonInput').value = position.coords.longitude;
                    
                    // Buscar automáticamente
                    document.getElementById('locationForm').dispatchEvent(new Event('submit'));
                }, error => {
                    console.error('Error obteniendo ubicación:', error);
                    alert('No se pudo obtener su ubicación. Por favor ingrese las coordenadas manualmente.');
                });
            } else {
                alert('Su navegador no soporta geolocalización');
            }
        }

        // Centrar mapa en farmacia más cercana
        function focusOnNearest() {
            const farmaciaName = document.getElementById('farmaciaNombre').textContent;
            const farmacia = allFarmacias.find(f => f.nombre === farmaciaName);
            
            if (farmacia) {
                zoomToFarmacia(farmacia);
            }
        }

        // Hacer zoom a una farmacia específica
        function zoomToFarmacia(farmacia) {
            map.setView([farmacia.latitud, farmacia.longitud], 15);
            
            const marker = farmaciaMarkers.find(m => 
                m.getLatLng().lat === parseFloat(farmacia.latitud) && 
                m.getLatLng().lng === parseFloat(farmacia.longitud)
            );
            
            if (marker) {
                marker.openPopup();
            }
        }

        // Mostrar modal para agregar farmacia
        function showAddFarmaciaModal() {
            document.getElementById('modalTitle').textContent = 'Nueva Farmacia';
            document.getElementById('farmaciaId').value = '';
            document.getElementById('farmaciaForm').reset();
            
            // Si hay un marcador actual, usar esas coordenadas
            if (currentMarker) {
                const latlng = currentMarker.getLatLng();
                document.getElementById('latitudInput').value = latlng.lat;
                document.getElementById('longitudInput').value = latlng.lng;
            }
            
            farmaciaModal.show();
        }

        // Mostrar modal para editar farmacia
        function showEditFarmaciaModal(farmacia) {
            document.getElementById('modalTitle').textContent = 'Editar Farmacia';
            document.getElementById('farmaciaId').value = farmacia.id;
            document.getElementById('nombreInput').value = farmacia.nombre;
            document.getElementById('ubicacionInput').value = farmacia.ubicacion;
            document.getElementById('latitudInput').value = farmacia.latitud;
            document.getElementById('longitudInput').value = farmacia.longitud;
            
            farmaciaModal.show();
        }

        // Guardar farmacia (crear o actualizar)
        function saveFarmacia() {
            const farmaciaId = document.getElementById('farmaciaId').value;
            const farmaciaData = {
                nombre: document.getElementById('nombreInput').value,
                ubicacion: document.getElementById('ubicacionInput').value,
                latitud: document.getElementById('latitudInput').value,
                longitud: document.getElementById('longitudInput').value
            };
            
            // Validación básica
            if (!farmaciaData.nombre || !farmaciaData.ubicacion || !farmaciaData.latitud || !farmaciaData.longitud) {
                alert('Todos los campos son obligatorios');
                return;
            }
            
            // Crear o actualizar
            const method = farmaciaId ? 'PUT' : 'POST';
            const url = farmaciaId ? `${API_URL}/farmacia/${farmaciaId}` : `${API_URL}/farmacia`;
            
            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(farmaciaData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    farmaciaModal.hide();
                    loadFarmacias(); // Recargar farmacias
                } else {
                    alert('Error al guardar: ' + (data.error || 'Error desconocido'));
                }
            })
            .catch(error => {
                console.error('Error al guardar farmacia:', error);
                alert('Error al guardar farmacia');
            });
        }

        // Eliminar farmacia
        function deleteFarmacia(id) {
            if (confirm('¿Está seguro de eliminar esta farmacia?')) {
                fetch(`${API_URL}/farmacia/${id}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loadFarmacias(); // Recargar farmacias
                    } else {
                        alert('Error al eliminar: ' + (data.error || 'Error desconocido'));
                    }
                })
                .catch(error => {
                    console.error('Error al eliminar farmacia:', error);
                    alert('Error al eliminar farmacia');
                });
            }
        }

        // Función global para usar desde popup del marcador
        window.searchFromMarker = function(lat, lon) {
            document.getElementById('latInput').value = lat;
            document.getElementById('lonInput').value = lon;
            document.getElementById('locationForm').dispatchEvent(new Event('submit'));
        };
    </script>
</body>
</html>
